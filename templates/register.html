
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | FindIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="mx-auto bg-white p-4 rounded-4 shadow-sm" style="max-width: 450px;">
            <a href="/" class="navbar-brand fw-bold">FindIt</a>
            <h1 class="h3 mt-4">Create an account</h1>
            <p class="text-secondary">Join your campus lost and found community.</p>

            {% for message in get_flashed_messages() %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label" for="name">Full name</label>
                    <input class="form-control" id="name" name="name"
                           maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email"
                           name="email" maxlength="150" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password"
                           name="password" minlength="8" required>
                </div>
                <button class="btn btn-success w-100">Register</button>
            </form>
            <p class="mt-3 mb-0">Already registered?
                <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
