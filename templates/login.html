
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | FindIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="mx-auto bg-white p-4 rounded-4 shadow-sm" style="max-width: 450px;">
            <a href="/" class="navbar-brand fw-bold">FindIt</a>
            <h1 class="h3 mt-4">Welcome back</h1>
            <p class="text-secondary">Log in to manage your reports.</p>

            {% for message in get_flashed_messages() %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email"
                           name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password"
                           name="password" required>
                </div>
                <button class="btn btn-success w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0">New to FindIt?
                <a href="{{ url_for('register') }}">Create an account</a>
            </p>
        </div>
    </div>
</body>
</html>
